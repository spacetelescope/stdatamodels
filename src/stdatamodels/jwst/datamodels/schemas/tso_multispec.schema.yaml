%YAML 1.1
---
$schema: "http://stsci.edu/schemas/asdf/asdf-schema-1.1.0"
id: "http://stsci.edu/schemas/jwst_datamodel/tso_multispec.schema"
allOf:
- $ref: core.schema
- $ref: int_times.schema
- type: object
  properties:
    hdrtab:
      title: Combined header table
      fits_hdu: HDRTAB
      allow_extra_columns: true
      datatype: []  # don't require any specific columns
    spec:
      type: array
      title: An array of spectra
      items:
        allOf:
          - type: object
            properties:
              spec_table:
                $ref: tso_spectable.schema
          - $ref: specmeta.schema
