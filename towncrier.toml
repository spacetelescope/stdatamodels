[tool.towncrier]
filename = "CHANGES.rst"
directory = "changes"
package = "stdatamodels"
title_format = "{version} ({project_date})"
ignore = ["README.md"]
wrap = true
issue_format = "`#{issue} <https://github.com/spacetelescope/stdatamodels/issues/{issue}>`_"

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking Changes"
showcontent = true

[[tool.towncrier.type]]
directory = "schema"
name = "Schema Changes"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "New Features"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Fixes"
showcontent = true

[[tool.towncrier.type]]
directory = "docs"
name = "Documentation Changes"
showcontent = true

[[tool.towncrier.type]]
directory = "other"
name = "Other Changes"
showcontent = true

